version: '3.8'

services:
  dna-simulation:
    build:
      context: .
      dockerfile: Dockerfile
    image: dna-transport-simulation:latest
    container_name: dna-simulation-web
    ports:
      - "5000:5000"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-this-secret-key-in-production}
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount results directory to persist data
      - ./results:/app/results
      # Mount logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

# Optional: Add nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: dna-simulation-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - dna-simulation
    restart: unless-stopped
    profiles:
      - production

volumes:
  results:
  logs:
