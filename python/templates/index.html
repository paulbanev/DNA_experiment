<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Transport Simulation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧬 DNA Transport Simulation</h1>
            <p>Quantum charge transport in DNA sequences</p>
        </header>

        <div class="main-content">
            <!-- Simulation Form -->
            <div class="card">
                <h2>New Simulation</h2>
                <form id="simulationForm">
                    <!-- Required Parameters -->
                    <div class="form-section">
                        <h3>Required Parameters</h3>
                        
                        <div class="form-group">
                            <label for="sequence">
                                DNA Sequence *
                                <span class="help-text">Enter sequence (A, T, G, C)</span>
                            </label>
                            <input type="text" id="sequence" name="sequence" 
                                   placeholder="e.g., ATGCAT" 
                                   pattern="[ATGCatgc]+" 
                                   required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="mode">Electronic Mode *</label>
                                <select id="mode" name="mode" required>
                                    <option value="HOMO">HOMO</option>
                                    <option value="LUMO">LUMO</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="model">Transport Model *</label>
                                <select id="model" name="model" required>
                                    <option value="FISHBONE">Fishbone</option>
                                    <option value="WIRE">Wire</option>
                                    <option value="LADDER">Ladder</option>
                                    <option value="EXTENDED_LADDER">Extended Ladder</option>
                                    <option value="SPECIALE">Special E</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="symmetry">Hopping Symmetry</label>
                                <select id="symmetry" name="symmetry">
                                    <option value="symmetric">Symmetric (tSp = tS)</option>
                                    <option value="asymmetric">Asymmetric (tSp = 0.16)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="disorder">Disorder Type</label>
                                <select id="disorder" name="disorder">
                                    <option value="0">No Disorder (0)</option>
                                    <option value="1">Type 1</option>
                                    <option value="2">Type 2</option>
                                    <option value="3">Type 3</option>
                                    <option value="4">Type 4</option>
                                    <option value="5">Type 5</option>
                                    <option value="6">Type 6</option>
                                    <option value="7">Type 7</option>
                                    <option value="8">Type 8</option>
                                    <option value="9">Type 9</option>
                                    <option value="10">Type 10</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Advanced Options -->
                    <details class="form-section">
                        <summary><h3>⚙️ Advanced Options</h3></summary>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="workers">
                                    Parallel Workers
                                    <span class="help-text">Number of CPU cores (0 = auto)</span>
                                </label>
                                <input type="number" id="workers" name="workers" 
                                       value="0" min="0" max="32">
                            </div>

                            <div class="form-group">
                                <label for="dos_bins">
                                    DOS Energy Bins
                                    <span class="help-text">Histogram resolution</span>
                                </label>
                                <input type="number" id="dos_bins" name="dos_bins" 
                                       value="10" min="5" max="100">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="seed">
                                Random Seed (optional)
                                <span class="help-text">Leave empty for random</span>
                            </label>
                            <input type="number" id="seed" name="seed" placeholder="e.g., 42">
                        </div>
                    </details>

                    <!-- Calculation Flags -->
                    <details class="form-section">
                        <summary><h3>🔧 Calculation Options</h3></summary>
                        
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="export" name="export" checked>
                                Export results to Excel
                            </label>

                            <label class="checkbox-label">
                                <input type="checkbox" id="disable_dos" name="disable_dos">
                                Disable DOS calculation (faster)
                            </label>

                            <label class="checkbox-label">
                                <input type="checkbox" id="disable_analytical" name="disable_analytical">
                                Disable analytical calculations (faster)
                            </label>

                            <label class="checkbox-label">
                                <input type="checkbox" id="disable_dipole_fft" name="disable_dipole_fft">
                                Disable dipole moment FFT (faster)
                            </label>

                            <label class="checkbox-label">
                                <input type="checkbox" id="disable_fft" name="disable_fft">
                                Disable FFT analysis
                            </label>

                            <label class="checkbox-label">
                                <input type="checkbox" id="disable_fourier" name="disable_fourier">
                                Disable Fourier analysis
                            </label>
                        </div>
                    </details>

                    <button type="submit" class="btn btn-primary">
                        🚀 Run Simulation
                    </button>
                </form>
            </div>

            <!-- Job History -->
            <div class="card">
                <h2>Recent Simulations</h2>
                <div id="jobList" class="job-list">
                    <p class="loading">Loading jobs...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
