version: '3.8'

services:
  dna-simulation:
    image: pavlosbanev/dna_experiment:latest
    container_name: dna-simulation-web
    expose:
      - "5000"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount results directory to persist data
      - dna_results:/app/results
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
volumes:
  dna_results:
    driver: local
